openapi: 3.0.3
info:
  title: Transport Cards Authorization API
  version: "1.0.0"
  description: |
    Simple REST API for transport card payment authorization.
    The API supports JWT authorization, CRUD operations, and terminal payment endpoints.
servers:
  - url: https://localhost:8888/api/v1
    description: Nginx HTTPS endpoint
  - url: http://localhost:8080/api/v1
    description: Direct Go server endpoint
tags:
  - name: auth
  - name: system
  - name: keys
  - name: terminals
  - name: users
  - name: cards
  - name: transactions
  - name: terminal-api
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Server is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /login:
    post:
      tags: [auth]
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
  /debug/db:
    get:
      tags: [system]
      summary: Read database summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Database summary
  /keys:
    get:
      tags: [keys]
      summary: List keys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"
    post:
      tags: [keys]
      summary: Create key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyRequest"
      responses:
        "201":
          description: Key created
  /keys/{id}:
    get:
      tags: [keys]
      summary: Get key by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Key found
    put:
      tags: [keys]
      summary: Update key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyRequest"
      responses:
        "200":
          description: Key updated
    delete:
      tags: [keys]
      summary: Delete key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Key deleted
  /terminals:
    get:
      tags: [terminals]
      summary: List terminals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of terminals
    post:
      tags: [terminals]
      summary: Create terminal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalRequest"
      responses:
        "201":
          description: Terminal created
  /terminals/{id}:
    get:
      tags: [terminals]
      summary: Get terminal by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Terminal found
    put:
      tags: [terminals]
      summary: Update terminal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalRequest"
      responses:
        "200":
          description: Terminal updated
    delete:
      tags: [terminals]
      summary: Delete terminal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Terminal deleted
  /users:
    get:
      tags: [users]
      summary: List users or current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users loaded
    post:
      tags: [users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: User created
  /users/{id}:
    get:
      tags: [users]
      summary: Get user by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User found
    put:
      tags: [users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: User updated
    delete:
      tags: [users]
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: User deleted
  /cards:
    get:
      tags: [cards]
      summary: List cards
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of cards
    post:
      tags: [cards]
      summary: Create card
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardRequest"
      responses:
        "201":
          description: Card created
  /cards/{id}:
    get:
      tags: [cards]
      summary: Get card by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Card found
    put:
      tags: [cards]
      summary: Update card
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardRequest"
      responses:
        "200":
          description: Card updated
    delete:
      tags: [cards]
      summary: Delete card
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Card deleted
  /transactions:
    get:
      tags: [transactions]
      summary: List transactions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of transactions
    post:
      tags: [transactions]
      summary: Create transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: Transaction created
  /transactions/{id}:
    get:
      tags: [transactions]
      summary: Get transaction by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transaction found
    put:
      tags: [transactions]
      summary: Update transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: Transaction updated
    delete:
      tags: [transactions]
      summary: Delete transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Transaction deleted
  /terminal/authorize:
    post:
      tags: [terminal-api]
      summary: Authorize terminal payment transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalAuthorizeRequest"
      responses:
        "200":
          description: Authorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalAuthorizeResponse"
  /terminal/keys:
    get:
      tags: [terminal-api]
      summary: Load all keys for terminal
      parameters:
        - name: terminal_serial_number
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Keys loaded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
    LoginUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        full_name:
          type: string
        is_admin:
          type: boolean
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/LoginUser"
    Key:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        value:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    KeyRequest:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
        description:
          type: string
    Terminal:
      type: object
      properties:
        id:
          type: integer
        serial_number:
          type: string
        name:
          type: string
        address:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    TerminalRequest:
      type: object
      required: [serial_number, name, address]
      properties:
        serial_number:
          type: string
        name:
          type: string
        address:
          type: string
        is_active:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
        login:
          type: string
        full_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserRequest:
      type: object
      properties:
        login:
          type: string
        full_name:
          type: string
        password:
          type: string
        is_admin:
          type: boolean
    Card:
      type: object
      properties:
        id:
          type: integer
        card_number:
          type: string
        owner_name:
          type: string
        balance:
          type: integer
        is_blocked:
          type: boolean
        key_id:
          type: integer
        created_at:
          type: string
          format: date-time
    CardRequest:
      type: object
      required: [card_number, owner_name, key_id]
      properties:
        card_number:
          type: string
        owner_name:
          type: string
        balance:
          type: integer
        is_blocked:
          type: boolean
        key_id:
          type: integer
    Transaction:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
        card_id:
          type: integer
        terminal_id:
          type: integer
        authorized:
          type: boolean
        created_at:
          type: string
          format: date-time
    TransactionRequest:
      type: object
      required: [amount, card_id, terminal_id]
      properties:
        amount:
          type: integer
        card_id:
          type: integer
        terminal_id:
          type: integer
        authorized:
          type: boolean
    TerminalAuthorizeRequest:
      type: object
      required: [terminal_serial_number, card_number, amount]
      properties:
        terminal_serial_number:
          type: string
        card_number:
          type: string
        amount:
          type: integer
    TerminalAuthorizeResponse:
      type: object
      properties:
        authorized:
          type: boolean
        message:
          type: string
        transaction:
          $ref: "#/components/schemas/Transaction"
